<form method="POST">
    {% csrf_token %}

    <h3>Publishers</h3>
    {% for publisher in publishers %}
        <input type="checkbox" name="publishers" value="{{ publisher.id }}">
        {{ publisher.username }}<br>
    {% endfor %}

    <h3>Journalists</h3>
    {% for journalist in journalists %}
        <input type="checkbox" name="journalists" value="{{ journalist.id }}">
        {{ journalist.username }}<br>
    {% endfor %}

    <button type="submit">Save</button>
</form>
