{% extends "news/base.html" %}

{% block title %}Create Publisher{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Create Publisher</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">
            Create Publisher
        </button>
    </form>

    <p>
        <a href="{% url 'home' %}">Back to Home</a>
    </p>
</div>
{% endblock %}
